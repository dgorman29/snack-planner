name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The project ref is the subdomain of VITE_SUPABASE_URL, so the site's
      # existing secret doubles as the deploy target.
      - name: Deploy snack-ai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a SUPABASE_ACCESS_TOKEN repository secret (Supabase dashboard > Account > Access Tokens), then re-run this workflow."
            exit 1
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\.supabase\.co.*#\1#')
          if [ -z "$REF" ] || [ "$REF" = "$SUPABASE_URL" ]; then
            echo "::error::Couldn't read the project ref from the VITE_SUPABASE_URL secret."
            exit 1
          fi
          supabase functions deploy snack-ai --no-verify-jwt --use-api --project-ref "$REF"
